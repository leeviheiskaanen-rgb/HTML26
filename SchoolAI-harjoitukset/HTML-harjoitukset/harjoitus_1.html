<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aihe 1: Mikä HTML Canvas on?</title>
</head>
<body>

    <canvas id="minunCanvas" width="400" height="300"></canvas>

    <script>  

        const canvas = document.getElementById("minunCanvas");  
        const ctx = canvas.getContext("2d");  
  
        ctx.fillStyle = "red";  
        ctx.fillRect(200, 50, 200, 100);  

    </script>  
    
</body>
</html>
